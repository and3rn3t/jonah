name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '.github/ISSUE_TEMPLATE/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', '.github/ISSUE_TEMPLATE/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    uses: and3rn3t/.github/.github/workflows/reusable-node-verify.yml@bac71674cf57c550774f71a70e32a5bb7bec48ad # v1
    with:
      command: npm run lint && npm run typecheck && npm run format:check && npm test && npm run build
